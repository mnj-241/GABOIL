<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion des Produits — GABOIL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="produits.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Bureau -->
        <aside class="sidebar">
            <div class="sidebar-brand"><span class="logo-accent">GAB</span>OIL</div>
            <nav class="sidebar-nav">
                <a href="accueil.html" class="nav-item">Accueil</a>
                <a href="caisse.html" class="nav-item">Caisse</a>
                <a href="produits.html" class="nav-item active">Produits</a>
                <a href="inventaire.html" class="nav-item">Inventaire</a>
                <a href="historique.html" class="nav-item">Historique</a>
                <a href="rapports.html" class="nav-item">Rapports</a>
                <a href="compte.html" class="nav-item">Mon Compte</a>
            </nav>
            <div class="sidebar-footer"><span id="sidebarUserName">...</span></div>
        </aside>

        <!-- Zone principale -->
        <main class="main-content-area">
            <header class="page-header">
                <h1>Catalogue des Produits</h1>
                <p>Ajoutez et gérez les articles vendus dans la station.</p>
            </header>

            <div id="productAlert" class="alert-box" style="display:none;"></div>

            <div class="produits-grid">
                <!-- Formulaire Ajout / Édition -->
                <div class="card">
                    <h3 id="formTitle">Ajouter un produit</h3>
                    <form id="productForm" class="product-form">
                        <input type="hidden" id="productId">
                        <div class="input-group">
                            <label for="productName">Nom du produit</label>
                            <input type="text" id="productName" placeholder="Ex: Essence Super" required>
                        </div>
                        <div class="input-group">
                            <label for="productPrice">Prix de vente unitaire (FCFA)</label>
                            <input type="number" id="productPrice" placeholder="0" min="0" required>
                        </div>
                        <div class="input-group">
                            <label for="productStock">Stock initial</label>
                            <input type="number" id="productStock" placeholder="0" min="0" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="saveProductBtn" class="btn btn-primary">Enregistrer</button>
                            <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display:none;">Annuler</button>
                        </div>
                    </form>
                </div>

                <!-- Liste des Produits -->
                <div class="card">
                    <div class="list-header">
                        <h3>Articles Enregistrés</h3>
                        <input type="text" id="searchCatalog" placeholder="Rechercher...">
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Nom</th>
                                    <th>Prix U</th>
                                    <th>Stock</th>
                                    <th>Statut</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr><td colspan="5" style="text-align:center; color:var(--color-gray);">Chargement...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- BARRE DE NAVIGATION MOBILE INFÉRIEURE PERMANENTE -->
    <nav class="bottom-nav-bar">
        <a href="accueil.html" class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Accueil</span>
        </a>
        <a href="caisse.html" class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span>Caisse</span>
        </a>
        <a href="produits.html" class="bottom-nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span>Produits</span>
        </a>
        <a href="inventaire.html" class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Stock</span>
        </a>
        <a href="compte.html" class="bottom-nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Compte</span>
        </a>
    </nav>

    <script type="module" src="produits.js"></script>
</body>
</html>
